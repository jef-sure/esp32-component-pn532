## IDF Component Manager Manifest File
version: "0.8.1"
description: "ESP-IDF component for the PN532 NFC reader over SPI, I2C, or UART/HSU"
url: https://github.com/jef-sure/esp32-component-pn532
repository: https://github.com/jef-sure/esp32-component-pn532.git
documentation: https://github.com/jef-sure/esp32-component-pn532/blob/main/README.md
issues: https://github.com/jef-sure/esp32-component-pn532/issues

dependencies:
  idf:
    version: ">=5.2.0"

tags:
  - nfc
  - spi
  - uart
  - i2c
  - rfid
  - pn532
  - iso14443a
  - ndef
  - mifare

maintainers:
  - "Anton Petrusevich <anton.petrusevich.mobile@gmail.com>"

license: MIT

files:
  # Only what is listed under include goes into the archive: include is applied after exclude,
  # and without an exclude of everything it would limit nothing. A new kind of file has to be
  # added here, or it silently stays out of the archive.
  exclude:
    - "**/*"
  include:
    - "src/**/*.c"
    - "src/**/*.h"
    - "include/**/*.h"
    - "CMakeLists.txt"
    - "examples/*/CMakeLists.txt"
    - "examples/*/README.md"
    - "examples/*/main/CMakeLists.txt"
    - "examples/*/main/*.c"
    - "examples/*/main/*.h"
    - "idf_component.yml"
    - "README.md"
    - "CHANGES.md"
    - "LICENSE"
